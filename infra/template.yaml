AWSTemplateFormatVersion: "2010-09-09"
Transform: AWS::Serverless-2016-10-31
Description: >
  Haraa -- serverless demo deployment (web Lambda behind CloudFront/API
  Gateway, a small Cognito-JWT-authorized JSON API, S3, DynamoDB, CloudWatch).
  No NAT gateways, no always-on compute, no provisioned-capacity DynamoDB.

Parameters:
  Stage:
    Type: String
    Default: demo
    Description: Short environment name used in resource names/tags.
  SessionSecret:
    Type: String
    NoEcho: true
    Description: >
      Random hex string generated by scripts/deploy.sh and passed in at
      deploy time -- signs the browser session cookie. Not an AWS credential;
      never logged or stored in the template.
  GeminiParameterName:
    Type: String
    Default: ""
    Description: >
      Name of an SSM SecureString parameter holding GEMINI_API_KEY, created
      OUTSIDE this template (aws ssm put-parameter --type SecureString) if
      you want the chatbot to use Gemini. Leave blank to skip Gemini entirely
      (chatbot falls back to Bedrock, then the offline assistant).
  EnableCloudFront:
    Type: String
    Default: "false"
    AllowedValues: ["true", "false"]
    Description: >
      "false" (default) skips CloudFront + the private frontend S3 bucket
      entirely -- use this until your AWS account is verified for CloudFront
      (see docs/ARCHITECTURE.md). The web Lambda's own StaticFiles mount
      still serves /static/* directly in that case; hit HttpApiUrl instead
      of CloudFrontUrl. Flip to "true" and redeploy once verified to add
      CloudFront back in -- nothing else about the stack changes.

Conditions:
  HasGeminiParameter: !Not [!Equals [!Ref GeminiParameterName, ""]]
  ShouldEnableCloudFront: !Equals [!Ref EnableCloudFront, "true"]

Globals:
  Function:
    Runtime: python3.12
    Architectures: [x86_64]
    Timeout: 15
    MemorySize: 256
    Tracing: PassThrough
    Environment:
      Variables:
        # AWS_REGION is set automatically by the Lambda runtime -- app.config
        # already reads it from the real environment, no override needed here.
        DYNAMODB_TABLE_NAME: !Ref WasteTable

Resources:
  # ---------------------------------------------------------------------
  # Cognito -- its own pool for the deployed environment (kept separate
  # from whatever local pool scripts/setup_aws.py created, so local and
  # deployed users never mix).
  # ---------------------------------------------------------------------
  UserPool:
    Type: AWS::Cognito::UserPool
    Properties:
      UserPoolName: !Sub "haraa-${Stage}-pool"
      UsernameAttributes: [email]
      AutoVerifiedAttributes: []
      Policies:
        PasswordPolicy:
          MinimumLength: 8
          RequireUppercase: true
          RequireLowercase: true
          RequireNumbers: true
          RequireSymbols: false
      Schema:
        - Name: email
          AttributeDataType: String
          Required: true
          Mutable: true
      AdminCreateUserConfig:
        AllowAdminCreateUserOnly: false
      UserPoolTags:
        Project: haraa
        Environment: !Ref Stage
        ManagedBy: sam

  UserPoolClient:
    Type: AWS::Cognito::UserPoolClient
    Properties:
      ClientName: !Sub "haraa-${Stage}-client"
      UserPoolId: !Ref UserPool
      GenerateSecret: false
      ExplicitAuthFlows:
        - ALLOW_USER_PASSWORD_AUTH
        - ALLOW_ADMIN_USER_PASSWORD_AUTH
        - ALLOW_REFRESH_TOKEN_AUTH

  # ---------------------------------------------------------------------
  # DynamoDB -- same PK/SK single-table design as scripts/setup_aws.py
  # ---------------------------------------------------------------------
  WasteTable:
    Type: AWS::DynamoDB::Table
    Properties:
      TableName: !Sub "haraa-${Stage}"
      BillingMode: PAY_PER_REQUEST
      AttributeDefinitions:
        - AttributeName: PK
          AttributeType: S
        - AttributeName: SK
          AttributeType: S
      KeySchema:
        - AttributeName: PK
          KeyType: HASH
        - AttributeName: SK
          KeyType: RANGE
      Tags:
        - Key: Project
          Value: haraa
        - Key: Environment
          Value: !Ref Stage
        - Key: ManagedBy
          Value: sam

  # ---------------------------------------------------------------------
  # S3 -- uploads (7-day lifecycle) and the frontend static-asset bucket
  # ---------------------------------------------------------------------
  UploadsBucket:
    Type: AWS::S3::Bucket
    Properties:
      BucketEncryption:
        ServerSideEncryptionConfiguration:
          - ServerSideEncryptionByDefault:
              SSEAlgorithm: AES256
      PublicAccessBlockConfiguration:
        BlockPublicAcls: true
        BlockPublicPolicy: true
        IgnorePublicAcls: true
        RestrictPublicBuckets: true
      LifecycleConfiguration:
        Rules:
          - Id: ExpireUploadsAfter7Days
            Status: Enabled
            Prefix: "uploads/"
            ExpirationInDays: 7
      CorsConfiguration:
        CorsRules:
          - AllowedMethods: [PUT, GET]
            AllowedOrigins: ["*"]
            AllowedHeaders: ["*"]
            MaxAge: 3000
      Tags:
        - Key: Project
          Value: haraa
        - Key: Environment
          Value: !Ref Stage
        - Key: ManagedBy
          Value: sam

  FrontendBucket:
    Type: AWS::S3::Bucket
    Condition: ShouldEnableCloudFront
    Properties:
      BucketEncryption:
        ServerSideEncryptionConfiguration:
          - ServerSideEncryptionByDefault:
              SSEAlgorithm: AES256
      PublicAccessBlockConfiguration:
        BlockPublicAcls: true
        BlockPublicPolicy: true
        IgnorePublicAcls: true
        RestrictPublicBuckets: true
      Tags:
        - Key: Project
          Value: haraa
        - Key: Environment
          Value: !Ref Stage
        - Key: ManagedBy
          Value: sam

  FrontendBucketPolicy:
    Type: AWS::S3::BucketPolicy
    Condition: ShouldEnableCloudFront
    Properties:
      Bucket: !Ref FrontendBucket
      PolicyDocument:
        Version: "2012-10-17"
        Statement:
          - Sid: AllowCloudFrontOAC
            Effect: Allow
            Principal:
              Service: cloudfront.amazonaws.com
            Action: s3:GetObject
            Resource: !Sub "${FrontendBucket.Arn}/*"
            Condition:
              StringEquals:
                AWS:SourceArn: !Sub "arn:aws:cloudfront::${AWS::AccountId}:distribution/${CloudFrontDistribution}"

  # ---------------------------------------------------------------------
  # CloudFront -- /static/* to the private S3 bucket (OAC), everything
  # else to the HTTP API (web Lambda + /api/v1/* JSON API live on the
  # same API, dispatched by path/route, not by CloudFront).
  # ---------------------------------------------------------------------
  FrontendOAC:
    Type: AWS::CloudFront::OriginAccessControl
    Condition: ShouldEnableCloudFront
    Properties:
      OriginAccessControlConfig:
        Name: !Sub "haraa-${Stage}-oac"
        OriginAccessControlOriginType: s3
        SigningBehavior: always
        SigningProtocol: sigv4

  CloudFrontDistribution:
    Type: AWS::CloudFront::Distribution
    Condition: ShouldEnableCloudFront
    Properties:
      DistributionConfig:
        Enabled: true
        HttpVersion: http2
        PriceClass: PriceClass_100
        Origins:
          - Id: FrontendS3Origin
            DomainName: !GetAtt FrontendBucket.RegionalDomainName
            OriginAccessControlId: !GetAtt FrontendOAC.Id
            S3OriginConfig:
              OriginAccessIdentity: ""
          - Id: ApiOrigin
            DomainName: !Sub "${HaraaHttpApi}.execute-api.${AWS::Region}.amazonaws.com"
            CustomOriginConfig:
              OriginProtocolPolicy: https-only
              OriginSSLProtocols: [TLSv1.2]
        DefaultCacheBehavior:
          TargetOriginId: ApiOrigin
          ViewerProtocolPolicy: redirect-to-https
          AllowedMethods: [GET, HEAD, OPTIONS, PUT, POST, PATCH, DELETE]
          CachedMethods: [GET, HEAD]
          CachePolicyId: 4135ea2d-6df8-44a3-9df3-4b5a84be39ad # Managed-CachingDisabled
          OriginRequestPolicyId: b689b0a8-53d0-40ab-baf2-68738e2966ac # Managed-AllViewerExceptHostHeader
          Compress: true
        CacheBehaviors:
          - PathPattern: "/static/*"
            TargetOriginId: FrontendS3Origin
            ViewerProtocolPolicy: redirect-to-https
            AllowedMethods: [GET, HEAD]
            CachedMethods: [GET, HEAD]
            CachePolicyId: 658327ea-f89d-4fab-a63d-7e88639e58f6 # Managed-CachingOptimized
            Compress: true
        ViewerCertificate:
          CloudFrontDefaultCertificate: true
      Tags:
        - Key: Project
          Value: haraa
        - Key: Environment
          Value: !Ref Stage
        - Key: ManagedBy
          Value: sam

  # ---------------------------------------------------------------------
  # API Gateway HTTP API -- shared by every function. /api/v1/* routes
  # carry the Cognito JWT authorizer; the web function's catch-all route
  # does its own cookie-session auth (like localhost) and has none.
  # ---------------------------------------------------------------------
  HaraaHttpApi:
    Type: AWS::Serverless::HttpApi
    Properties:
      # No StageName -> SAM creates the implicit "$default" auto-deploy
      # stage, so the bare execute-api domain works with no stage prefix --
      # important since CloudFront's ApiOrigin below proxies to that root.
      Auth:
        Authorizers:
          CognitoJwtAuthorizer:
            JwtConfiguration:
              issuer: !Sub "https://cognito-idp.${AWS::Region}.amazonaws.com/${UserPool}"
              audience:
                - !Ref UserPoolClient
            IdentitySource: "$request.header.Authorization"
      # Account-wide safety net: 10 req/s steady, burst 20, across every
      # route (web pages + all of /api/v1/*). The two routes that actually
      # spend real money per call (S3 presign + Rekognition DetectLabels)
      # get a much tighter per-route override on top of that, so a script
      # hammering the public URL can't run up Rekognition/S3 charges even
      # though those routes require a valid Cognito JWT to reach at all.
      DefaultRouteSettings:
        ThrottlingRateLimit: 10
        ThrottlingBurstLimit: 20
      RouteSettings:
        "POST /api/v1/uploads/presign":
          ThrottlingRateLimit: 2
          ThrottlingBurstLimit: 5
        "POST /api/v1/classify":
          ThrottlingRateLimit: 2
          ThrottlingBurstLimit: 5

  # ---------------------------------------------------------------------
  # Shared Lambda layer: fastapi/mangum/pillow/jinja2/google-genai stack,
  # cross-platform `pip install` (no Docker) -- see infra/Makefile.
  # ---------------------------------------------------------------------
  WebDepsLayer:
    Type: AWS::Serverless::LayerVersion
    Properties:
      LayerName: !Sub "haraa-${Stage}-web-deps"
      ContentUri: ../  # unused directly; Makefile build populates ARTIFACTS_DIR
      CompatibleRuntimes: [python3.12]
      RetentionPolicy: Delete
    Metadata:
      BuildMethod: makefile

  # ---------------------------------------------------------------------
  # Web function -- the whole existing FastAPI/Jinja app via Mangum.
  # Same session-cookie auth as localhost; this IS "the frontend" (plus
  # the static assets CloudFront serves from S3).
  # ---------------------------------------------------------------------
  WebFunction:
    Type: AWS::Serverless::Function
    Properties:
      FunctionName: !Sub "haraa-${Stage}-web"
      Handler: app.main_lambda.handler
      CodeUri: ../
      MemorySize: 512
      Timeout: 29
      Layers: [!Ref WebDepsLayer]
      Environment:
        Variables:
          LOCAL_ML_ENABLED: "false"
          SESSION_HTTPS_ONLY: "true"
          SESSION_SECRET: !Ref SessionSecret
          COGNITO_USER_POOL_ID: !Ref UserPool
          COGNITO_CLIENT_ID: !Ref UserPoolClient
      Policies:
        - Statement:
            - Effect: Allow
              Action: [dynamodb:GetItem, dynamodb:PutItem, dynamodb:UpdateItem, dynamodb:Query]
              Resource: !GetAtt WasteTable.Arn
            - Effect: Allow
              Action: [rekognition:DetectLabels]
              Resource: "*" # Rekognition DetectLabels has no resource-level permissions (see docs/SECURITY.md)
            - Effect: Allow
              Action:
                - cognito-idp:InitiateAuth
                - cognito-idp:SignUp
              Resource: "*" # these two actions don't support resource-level scoping either
            - Effect: Allow
              Action:
                - cognito-idp:AdminConfirmSignUp
                - cognito-idp:AdminUpdateUserAttributes
              Resource: !GetAtt UserPool.Arn
            - Effect: Allow
              Action: [bedrock:InvokeModel]
              Resource: !Sub "arn:aws:bedrock:${AWS::Region}::foundation-model/*"
            - !If
              - HasGeminiParameter
              - Effect: Allow
                Action: [ssm:GetParameter]
                Resource: !Sub "arn:aws:ssm:${AWS::Region}:${AWS::AccountId}:parameter${GeminiParameterName}"
              - !Ref AWS::NoValue
      Events:
        Root:
          Type: HttpApi
          Properties:
            ApiId: !Ref HaraaHttpApi
            Path: /
            Method: ANY
        Proxy:
          Type: HttpApi
          Properties:
            ApiId: !Ref HaraaHttpApi
            Path: /{proxy+}
            Method: ANY
      Tags:
        Project: haraa
        Environment: !Ref Stage
        ManagedBy: sam
    Metadata:
      BuildMethod: makefile

  # ---------------------------------------------------------------------
  # /api/v1/* JSON functions -- Cognito-JWT-authorized, no pip layer (pure
  # stdlib + the runtime-provided boto3), except Chatbot which reuses the
  # WebDepsLayer for google-genai.
  # ---------------------------------------------------------------------
  ClassifyFunction:
    Type: AWS::Serverless::Function
    Properties:
      FunctionName: !Sub "haraa-${Stage}-classify"
      Handler: handler.lambda_handler
      CodeUri: ../
      Environment:
        Variables:
          UPLOADS_BUCKET: !Ref UploadsBucket
      Policies:
        - Statement:
            - Effect: Allow
              Action: [rekognition:DetectLabels]
              Resource: "*"
            - Effect: Allow
              Action: [s3:GetObject]
              Resource: !Sub "${UploadsBucket.Arn}/uploads/*"
      Events:
        Api:
          Type: HttpApi
          Properties:
            ApiId: !Ref HaraaHttpApi
            Path: /api/v1/classify
            Method: POST
            Auth:
              Authorizer: CognitoJwtAuthorizer
      Tags:
        Project: haraa
        Environment: !Ref Stage
        ManagedBy: sam
    Metadata:
      BuildMethod: makefile

  PresignFunction:
    Type: AWS::Serverless::Function
    Properties:
      FunctionName: !Sub "haraa-${Stage}-presign"
      Handler: handler.lambda_handler
      CodeUri: ../
      Environment:
        Variables:
          UPLOADS_BUCKET: !Ref UploadsBucket
      Policies:
        - Statement:
            - Effect: Allow
              Action: [s3:PutObject]
              Resource: !Sub "${UploadsBucket.Arn}/uploads/*"
      Events:
        Api:
          Type: HttpApi
          Properties:
            ApiId: !Ref HaraaHttpApi
            Path: /api/v1/uploads/presign
            Method: POST
            Auth:
              Authorizer: CognitoJwtAuthorizer
      Tags:
        Project: haraa
        Environment: !Ref Stage
        ManagedBy: sam
    Metadata:
      BuildMethod: makefile

  LogWasteFunction:
    Type: AWS::Serverless::Function
    Properties:
      FunctionName: !Sub "haraa-${Stage}-log-waste"
      Handler: handler.lambda_handler
      CodeUri: ../
      Policies:
        - Statement:
            - Effect: Allow
              Action: [dynamodb:PutItem, dynamodb:UpdateItem]
              Resource: !GetAtt WasteTable.Arn
      Events:
        Api:
          Type: HttpApi
          Properties:
            ApiId: !Ref HaraaHttpApi
            Path: /api/v1/waste-events
            Method: POST
            Auth:
              Authorizer: CognitoJwtAuthorizer
      Tags:
        Project: haraa
        Environment: !Ref Stage
        ManagedBy: sam
    Metadata:
      BuildMethod: makefile

  DashboardFunction:
    Type: AWS::Serverless::Function
    Properties:
      FunctionName: !Sub "haraa-${Stage}-dashboard"
      Handler: handler.lambda_handler
      CodeUri: ../
      Policies:
        - Statement:
            - Effect: Allow
              Action: [dynamodb:GetItem, dynamodb:Query]
              Resource: !GetAtt WasteTable.Arn
      Events:
        Api:
          Type: HttpApi
          Properties:
            ApiId: !Ref HaraaHttpApi
            Path: /api/v1/dashboard
            Method: GET
            Auth:
              Authorizer: CognitoJwtAuthorizer
      Tags:
        Project: haraa
        Environment: !Ref Stage
        ManagedBy: sam
    Metadata:
      BuildMethod: makefile

  QuizScoresFunction:
    Type: AWS::Serverless::Function
    Properties:
      FunctionName: !Sub "haraa-${Stage}-quiz-scores"
      Handler: handler.lambda_handler
      CodeUri: ../
      Policies:
        - Statement:
            - Effect: Allow
              Action: [dynamodb:GetItem, dynamodb:PutItem]
              Resource: !GetAtt WasteTable.Arn
      Events:
        GetApi:
          Type: HttpApi
          Properties:
            ApiId: !Ref HaraaHttpApi
            Path: /api/v1/quiz-score
            Method: GET
            Auth:
              Authorizer: CognitoJwtAuthorizer
        PostApi:
          Type: HttpApi
          Properties:
            ApiId: !Ref HaraaHttpApi
            Path: /api/v1/quiz-score
            Method: POST
            Auth:
              Authorizer: CognitoJwtAuthorizer
      Tags:
        Project: haraa
        Environment: !Ref Stage
        ManagedBy: sam
    Metadata:
      BuildMethod: makefile

  ChatbotFunction:
    Type: AWS::Serverless::Function
    Properties:
      FunctionName: !Sub "haraa-${Stage}-chatbot"
      Handler: handler.lambda_handler
      CodeUri: ../
      MemorySize: 512
      Timeout: 29
      Layers: [!Ref WebDepsLayer]
      Environment:
        Variables:
          GEMINI_SSM_PARAM_NAME: !Ref GeminiParameterName
      Policies:
        - Statement:
            - Effect: Allow
              Action: [bedrock:InvokeModel]
              Resource: !Sub "arn:aws:bedrock:${AWS::Region}::foundation-model/*"
            - !If
              - HasGeminiParameter
              - Effect: Allow
                Action: [ssm:GetParameter]
                Resource: !Sub "arn:aws:ssm:${AWS::Region}:${AWS::AccountId}:parameter${GeminiParameterName}"
              - !Ref AWS::NoValue
      Events:
        Api:
          Type: HttpApi
          Properties:
            ApiId: !Ref HaraaHttpApi
            Path: /api/v1/chat
            Method: POST
            Auth:
              Authorizer: CognitoJwtAuthorizer
      Tags:
        Project: haraa
        Environment: !Ref Stage
        ManagedBy: sam
    Metadata:
      BuildMethod: makefile

  # ---------------------------------------------------------------------
  # CloudWatch -- dashboard + error alarms. The estimated-charges alarm is
  # created separately in us-east-1 by scripts/deploy.sh (AWS/Billing
  # metrics only exist there, regardless of this stack's region).
  # ---------------------------------------------------------------------
  OperationsDashboard:
    Type: AWS::CloudWatch::Dashboard
    Properties:
      DashboardName: !Sub "haraa-${Stage}"
      DashboardBody: !Sub |
        {
          "widgets": [
            {
              "type": "metric", "x": 0, "y": 0, "width": 12, "height": 6,
              "properties": {
                "title": "API Gateway -- requests / errors",
                "region": "${AWS::Region}",
                "view": "timeSeries",
                "metrics": [
                  ["AWS/ApiGateway", "Count", "ApiId", "${HaraaHttpApi}", {"stat": "Sum", "label": "Requests"}],
                  ["AWS/ApiGateway", "4xx", "ApiId", "${HaraaHttpApi}", {"stat": "Sum", "label": "4xx"}],
                  ["AWS/ApiGateway", "5xx", "ApiId", "${HaraaHttpApi}", {"stat": "Sum", "label": "5xx"}]
                ]
              }
            },
            {
              "type": "metric", "x": 12, "y": 0, "width": 12, "height": 6,
              "properties": {
                "title": "API Gateway -- latency (ms)",
                "region": "${AWS::Region}",
                "view": "timeSeries",
                "metrics": [
                  ["AWS/ApiGateway", "Latency", "ApiId", "${HaraaHttpApi}", {"stat": "p50", "label": "p50"}],
                  ["AWS/ApiGateway", "Latency", "ApiId", "${HaraaHttpApi}", {"stat": "p99", "label": "p99"}]
                ]
              }
            },
            {
              "type": "metric", "x": 0, "y": 6, "width": 12, "height": 6,
              "properties": {
                "title": "Lambda duration (avg ms) -- all haraa functions",
                "region": "${AWS::Region}",
                "view": "timeSeries",
                "metrics": [
                  [{"expression": "SEARCH('{AWS/Lambda,FunctionName} MetricName=\"Duration\" FunctionName=\"haraa-${Stage}-*\"', 'Average', 300)", "id": "dur"}]
                ]
              }
            },
            {
              "type": "metric", "x": 12, "y": 6, "width": 12, "height": 6,
              "properties": {
                "title": "Lambda errors (sum) -- all haraa functions",
                "region": "${AWS::Region}",
                "view": "timeSeries",
                "metrics": [
                  [{"expression": "SEARCH('{AWS/Lambda,FunctionName} MetricName=\"Errors\" FunctionName=\"haraa-${Stage}-*\"', 'Sum', 300)", "id": "err"}]
                ]
              }
            },
            {
              "type": "metric", "x": 0, "y": 12, "width": 24, "height": 6,
              "properties": {
                "title": "DynamoDB -- throttled requests",
                "region": "${AWS::Region}",
                "view": "timeSeries",
                "metrics": [
                  ["AWS/DynamoDB", "ReadThrottleEvents", "TableName", "${WasteTable}", {"stat": "Sum"}],
                  ["AWS/DynamoDB", "WriteThrottleEvents", "TableName", "${WasteTable}", {"stat": "Sum"}]
                ]
              }
            }
          ]
        }

  AlarmTopic:
    Type: AWS::SNS::Topic
    Properties:
      TopicName: !Sub "haraa-${Stage}-alarms"
      Tags:
        - Key: Project
          Value: haraa
        - Key: Environment
          Value: !Ref Stage
        - Key: ManagedBy
          Value: sam

  ApiServerErrorsAlarm:
    Type: AWS::CloudWatch::Alarm
    Properties:
      AlarmName: !Sub "haraa-${Stage}-api-5xx"
      AlarmDescription: "API Gateway returned one or more 5xx responses."
      Namespace: AWS/ApiGateway
      MetricName: "5xx"
      Dimensions:
        - Name: ApiId
          Value: !Ref HaraaHttpApi
      Statistic: Sum
      Period: 300
      EvaluationPeriods: 1
      Threshold: 1
      ComparisonOperator: GreaterThanOrEqualToThreshold
      TreatMissingData: notBreaching
      AlarmActions: [!Ref AlarmTopic]

  ClassifyRekognitionCostGuardAlarm:
    Type: AWS::CloudWatch::Alarm
    Properties:
      AlarmName: !Sub "haraa-${Stage}-classify-invocation-spike"
      AlarmDescription: >
        Classify Lambda (Rekognition DetectLabels, ~$1/1,000 images) invoked
        unusually often in 5 minutes -- paired with the tighter per-route
        throttle on POST /api/v1/classify and /api/v1/uploads/presign above,
        this is the second line of defense against the public URL running
        up Rekognition/S3 charges.
      Namespace: AWS/Lambda
      MetricName: Invocations
      Dimensions:
        - Name: FunctionName
          Value: !Ref ClassifyFunction
      Statistic: Sum
      Period: 300
      EvaluationPeriods: 1
      Threshold: 100
      ComparisonOperator: GreaterThanOrEqualToThreshold
      TreatMissingData: notBreaching
      AlarmActions: [!Ref AlarmTopic]

  LambdaErrorsAlarm:
    Type: AWS::CloudWatch::Alarm
    Properties:
      AlarmName: !Sub "haraa-${Stage}-lambda-errors"
      AlarmDescription: "Any haraa Lambda function raised an error."
      EvaluationPeriods: 1
      Threshold: 1
      ComparisonOperator: GreaterThanOrEqualToThreshold
      TreatMissingData: notBreaching
      Metrics:
        - Id: web
          MetricStat:
            Metric: {Namespace: AWS/Lambda, MetricName: Errors, Dimensions: [{Name: FunctionName, Value: !Ref WebFunction}]}
            Period: 300
            Stat: Sum
          ReturnData: false
        - Id: classify
          MetricStat:
            Metric: {Namespace: AWS/Lambda, MetricName: Errors, Dimensions: [{Name: FunctionName, Value: !Ref ClassifyFunction}]}
            Period: 300
            Stat: Sum
          ReturnData: false
        - Id: presign
          MetricStat:
            Metric: {Namespace: AWS/Lambda, MetricName: Errors, Dimensions: [{Name: FunctionName, Value: !Ref PresignFunction}]}
            Period: 300
            Stat: Sum
          ReturnData: false
        - Id: logwaste
          MetricStat:
            Metric: {Namespace: AWS/Lambda, MetricName: Errors, Dimensions: [{Name: FunctionName, Value: !Ref LogWasteFunction}]}
            Period: 300
            Stat: Sum
          ReturnData: false
        - Id: dashboardfn
          MetricStat:
            Metric: {Namespace: AWS/Lambda, MetricName: Errors, Dimensions: [{Name: FunctionName, Value: !Ref DashboardFunction}]}
            Period: 300
            Stat: Sum
          ReturnData: false
        - Id: quiz
          MetricStat:
            Metric: {Namespace: AWS/Lambda, MetricName: Errors, Dimensions: [{Name: FunctionName, Value: !Ref QuizScoresFunction}]}
            Period: 300
            Stat: Sum
          ReturnData: false
        - Id: chatbot
          MetricStat:
            Metric: {Namespace: AWS/Lambda, MetricName: Errors, Dimensions: [{Name: FunctionName, Value: !Ref ChatbotFunction}]}
            Period: 300
            Stat: Sum
          ReturnData: false
        - Id: total
          Expression: "web + classify + presign + logwaste + dashboardfn + quiz + chatbot"
          Label: TotalLambdaErrors
          ReturnData: true
      AlarmActions: [!Ref AlarmTopic]

Outputs:
  CloudFrontUrl:
    Condition: ShouldEnableCloudFront
    Description: Public HTTPS URL for the deployed app (CloudFront).
    Value: !Sub "https://${CloudFrontDistribution.DomainName}"
  HttpApiUrl:
    Description: >
      Direct API Gateway URL. This is the primary URL when EnableCloudFront=false
      (static assets are served by the web Lambda's own StaticFiles mount).
    Value: !Sub "https://${HaraaHttpApi}.execute-api.${AWS::Region}.amazonaws.com"
  UserPoolId:
    Value: !Ref UserPool
  UserPoolClientId:
    Value: !Ref UserPoolClient
  WasteTableName:
    Value: !Ref WasteTable
  UploadsBucketName:
    Value: !Ref UploadsBucket
  AlarmTopicArn:
    Value: !Ref AlarmTopic
